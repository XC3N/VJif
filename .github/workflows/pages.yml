# Builds dist/ with build.js and publishes it to GitHub Pages on every push to main.
# One-time setup: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# Test builds: whatever the `test` branch holds is built too and published at /test/ (the root is always main).
# To put a PR on vjif.net/test: point `test` at its head (git push -f origin <pr-branch>:test), then run this
# workflow (Actions → Build and deploy to Pages → Run workflow). The run input `test_ref` can name another
# branch or SHA instead. With no `test` branch, /test/ is simply not published.
name: Build and deploy to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_ref:
        description: 'Branch or SHA to publish at /test/ (default is the test branch)'
        required: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node build.js
      - name: Check out the test build
        id: test
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.test_ref || 'test' }}
          path: _test
      - name: Build it into dist/test
        if: steps.test.outcome == 'success'
        run: |
          (cd _test && node build.js)
          mkdir dist/test
          cp -r _test/dist/. dist/test/
          # a test build should not be indexed
          sed -i '0,/<head>/s//<head><meta name="robots" content="noindex">/' dist/test/*.html
          echo "Test build: $(git -C _test log -1 --format='%h %s')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
